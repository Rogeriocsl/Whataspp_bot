<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Bot WhatsApp</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        #loading {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            flex-direction: column; /* Para empilhar o texto e o spinner */
        }
        #botMessage {
            display: none; /* Esconde inicialmente */
            text-align: center;
            margin-top: 20px;
        }
        #qr-code {
            text-align: center;
            margin-top: 20px;
        }
        #qr-code img {
            max-width: 100%; /* Garante que o QR code não exceda a largura da tela */
            height: auto;
        }
        /* Estilos do Spinner */
        .spinner {
            border: 8px solid #f3f3f3; /* Cor de fundo do spinner */
            border-top: 8px solid #3498db; /* Cor da parte de cima do spinner */
            border-radius: 50%;
            width: 50px; /* Tamanho do spinner */
            height: 50px; /* Tamanho do spinner */
            animation: spin 2s linear infinite; /* Animação do spinner */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        Carregando QR Code...
        <div class="spinner"></div> <!-- Spinner -->
    </div>
    <div id="botMessage">
        <img src="assets/robot-image.png" alt="Bot Funcionando" width="300"><br>
        <h1>Bot Funcionando!</h1>
    </div>
    <div id="qr-code"></div>
    <script>
        const { ipcRenderer } = require('electron');

        // Ouve a mensagem do QR Code
        ipcRenderer.on('qr', (event, url) => {
            document.getElementById('loading').style.display = 'none'; // Esconde a tela de carregamento
            document.getElementById('qr-code').innerHTML = `<img src="${url}" alt="QR Code">`; // Mostra o QR Code
        });

        // Se você tiver um evento para autenticação bem-sucedida:
        ipcRenderer.on('authenticated', () => {
            document.getElementById('loading').style.display = 'none'; // Esconde a tela de carregamento
            document.getElementById('botMessage').style.display = 'block'; // Mostra a mensagem do bot
        });

        // Exibe a mensagem de erro, caso a reconexão falhe
        ipcRenderer.on('error', (event, message) => {
            const errorMessage = document.createElement('div');
            errorMessage.style.color = 'red';
            errorMessage.style.marginTop = '20px';
            errorMessage.innerText = message;
            document.body.appendChild(errorMessage); // Exibe a mensagem de erro
        });

        // Recebe a confirmação de que os dados da sessão foram limpos
        ipcRenderer.on('session-cleared', () => {
            alert('Dados da sessão foram limpos. Iniciando uma nova sessão...');
        });
    </script>
</body>
</html>
